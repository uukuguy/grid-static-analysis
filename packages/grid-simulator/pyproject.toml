[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grid-simulator"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pandapower==3.4.0", "pydantic>=2.12,<3", "jsonschema>=4"]

[project.scripts]
gridctl = "grid_simulator.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/grid_simulator"]
exclude = ["src/grid_simulator/capabilities/definitions/*"]

[tool.hatch.build.targets.wheel.force-include]
"src/grid_simulator/capabilities/definitions" = "grid_simulator/capabilities/definitions"
